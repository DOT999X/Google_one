<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4C7A3C">
<title>AgriN — Smart Farming Advisory</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ivory: #FBF7EF;
  --ivory-warm: #F5EEE0;
  --sky: #2C4870;
  --sky-soft: #E7EEF6;
  --leaf: #4C7A3C;
  --leaf-light: #EAF2E3;
  --leaf-deep: #365A29;
  --gold: #D9A441;
  --gold-soft: #FBF0DC;
  --soil: #4A3B2C;
  --soil-soft: #EFE7DA;
  --clay: #C05621;
  --clay-soft: #FBEAE0;
  --ink: #2B2420;
  --ink-soft: #6B5F52;
  --line: #E4DACB;
  --white: #FFFFFF;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(74, 59, 44, 0.08);
  --shadow-md: 0 8px 24px rgba(74, 59, 44, 0.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ivory: #1C1812; --ivory-warm: #23201A;
    --sky: #6E93C4; --sky-soft: #223047;
    --leaf: #7BAE64; --leaf-light: #223321; --leaf-deep: #9FCB8B;
    --gold: #E8B85C; --gold-soft: #332711;
    --soil: #E7DCC9; --soil-soft: #2A2419;
    --clay: #E0824C; --clay-soft: #35211A;
    --ink: #F2ECE0; --ink-soft: #B3A794;
    --line: #3A3327; --white: #262019;
    --shadow: 0 2px 12px rgba(0,0,0,0.3); --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"] {
  --ivory: #1C1812; --ivory-warm: #23201A;
  --sky: #6E93C4; --sky-soft: #223047;
  --leaf: #7BAE64; --leaf-light: #223321; --leaf-deep: #9FCB8B;
  --gold: #E8B85C; --gold-soft: #332711;
  --soil: #E7DCC9; --soil-soft: #2A2419;
  --clay: #E0824C; --clay-soft: #35211A;
  --ink: #F2ECE0; --ink-soft: #B3A794;
  --line: #3A3327; --white: #262019;
  --shadow: 0 2px 12px rgba(0,0,0,0.3); --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  font-family: 'Work Sans', -apple-system, sans-serif;
  background: var(--ivory); color: var(--ink);
  line-height: 1.55; -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
h1, h2, h3, .serif { font-family: 'Fraunces', Georgia, serif; }

/* ---------- Hero — the one bold, memorable moment ---------- */
.hero {
  background: linear-gradient(160deg, var(--sky) 0%, var(--sky) 38%, var(--leaf-deep) 100%);
  color: var(--ivory);
  padding: 30px 20px 24px;
  position: relative;
  overflow: hidden;
}
.hero-blobs { position: absolute; inset: 0; overflow: hidden; }
.blob {
  position: absolute; border-radius: 50%; filter: blur(40px); opacity: 0.35;
  animation: drift 18s ease-in-out infinite;
}
.blob-1 { width: 180px; height: 180px; background: var(--gold); top: -60px; right: -40px; animation-delay: 0s; }
.blob-2 { width: 140px; height: 140px; background: var(--leaf); bottom: -50px; left: -30px; animation-delay: -6s; }
.blob-3 { width: 110px; height: 110px; background: var(--ivory); top: 30%; left: 55%; opacity: 0.12; animation-delay: -11s; }
@keyframes drift {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(14px, -10px) scale(1.08); }
}
@media (prefers-reduced-motion: reduce) { .blob { animation: none; } }
.hero::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
  background: linear-gradient(180deg, transparent, rgba(217,164,65,0.16));
  pointer-events: none;
}
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 1; }
.wordmark { display: flex; align-items: center; gap: 9px; }
.wordmark .mark {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, var(--gold), var(--leaf));
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);
  flex-shrink: 0;
}
.hero h1 {
  font-size: 27px; font-weight: 700; letter-spacing: -0.3px;
  background: linear-gradient(135deg, #FFFFFF, var(--gold-soft));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero .tagline { font-size: 13px; opacity: 0.85; margin-top: 2px; font-weight: 400; }
.lang-select {
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.28);
  color: var(--ivory); border-radius: var(--radius-sm); padding: 7px 10px;
  font-size: 13px; font-family: inherit; font-weight: 500;
}
.lang-select option { color: var(--ink); background: var(--white); }

.tabs { display: flex; gap: 6px; margin: 20px 16px 0; position: relative; z-index: 1; }
.tab {
  flex: 1; padding: 11px 8px; border: none; border-radius: var(--radius-md);
  font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  background: rgba(255,255,255,0.12); color: var(--ivory); font-family: inherit;
}
.tab.active { background: var(--ivory); color: var(--soil); box-shadow: var(--shadow-md); }

.content { padding: 16px; max-width: 600px; margin: 0 auto; }

/* ---------- Cards — subtle tinted sheen instead of flat grey ---------- */
.card {
  background: var(--white); border-radius: var(--radius-lg); padding: 20px;
  box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid var(--line);
  position: relative; overflow: hidden;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 60px;
  background: linear-gradient(180deg, var(--ivory-warm), transparent);
  opacity: 0.5; pointer-events: none;
}
.card-title {
  font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px; position: relative;
}

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-soft); margin-bottom: 5px; }
.field input, .field select {
  width: 100%; padding: 11px 13px; border: 1.5px solid var(--line);
  border-radius: var(--radius-sm); font-size: 15px; font-family: inherit;
  background: var(--ivory-warm); color: var(--ink); transition: border-color 0.2s;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--leaf); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn {
  width: 100%; padding: 14px; border: none; border-radius: var(--radius-md);
  font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: transform 0.15s, box-shadow 0.15s; position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary { background: linear-gradient(135deg, var(--leaf), var(--leaf-deep)); color: var(--white); }
.btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-secondary { background: var(--ivory-warm); color: var(--soil); }

.upload-area {
  border: 2px dashed var(--line); border-radius: var(--radius-lg);
  padding: 30px 16px; text-align: center; cursor: pointer;
  transition: all 0.2s; position: relative; overflow: hidden; background: var(--ivory-warm);
}
.upload-area:hover { border-color: var(--leaf); background: var(--leaf-light); }
.upload-area.has-image { border-style: solid; border-color: var(--leaf); padding: 8px; background: var(--white); }
.upload-area img { max-width: 100%; max-height: 220px; border-radius: var(--radius-md); }
.upload-area input { display: none; }
.upload-icon { font-size: 34px; margin-bottom: 8px; }
.upload-text { font-size: 14px; color: var(--ink-soft); }

.loader { display: flex; flex-direction: column; align-items: center; padding: 44px 20px; gap: 14px; }
.spinner {
  width: 38px; height: 38px; border: 3px solid var(--line);
  border-top-color: var(--leaf); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { font-size: 13.5px; color: var(--ink-soft); text-align: center; }

.summary-card {
  border-radius: var(--radius-lg); padding: 20px; margin-bottom: 14px;
  color: var(--white); position: relative; overflow: hidden;
}
.summary-card.ok { background: linear-gradient(135deg, var(--leaf-deep), var(--leaf)); }
.summary-card.warn { background: linear-gradient(135deg, #8A4A16, var(--clay)); }
.summary-title { font-size: 21px; font-weight: 600; font-family: 'Fraunces', serif; }
.summary-subtitle { font-size: 13.5px; opacity: 0.88; margin-top: 4px; }

.uncertain-banner {
  background: var(--clay-soft); border: 1.5px solid var(--clay);
  border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 14px;
  display: flex; gap: 12px; align-items: flex-start;
}
.uncertain-banner .icon { font-size: 22px; line-height: 1; flex-shrink: 0; }
.uncertain-banner .text { font-size: 13.5px; color: var(--soil); line-height: 1.5; }
.uncertain-banner .text strong { color: var(--clay); }

.predictions { margin-top: 4px; }
.pred-card {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px;
  background: var(--white); border-radius: var(--radius-md); margin-bottom: 8px;
  border: 1px solid var(--line);
}
.pred-card.rank-1 { border-color: var(--gold); background: var(--gold-soft); }
.pred-rank {
  width: 30px; height: 30px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 13px;
  font-weight: 700; flex-shrink: 0; font-family: 'Fraunces', serif;
}
.pred-rank-1 { background: var(--gold); color: var(--white); }
.pred-rank-2 { background: var(--leaf-light); color: var(--leaf-deep); }
.pred-rank-3 { background: var(--soil-soft); color: var(--soil); }
.pred-name { font-size: 15px; font-weight: 600; color: var(--ink); text-transform: capitalize; }
.pred-detail { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
.pred-score { margin-left: auto; font-size: 15px; font-weight: 700; color: var(--leaf-deep); font-family: 'Fraunces', serif; }
.est-tag {
  font-size: 10.5px; padding: 2px 7px; border-radius: 20px;
  background: var(--sky-soft); color: var(--sky); margin-left: 6px; font-weight: 600;
}

/* ---------- Advisory: collapsible for a compact, single-page feel ---------- */
.advisory { margin-top: 14px; }
.advisory-section {
  border-radius: var(--radius-lg); box-shadow: var(--shadow);
  border-left: 4px solid var(--line); background: var(--white);
  margin-bottom: 10px; overflow: hidden; position: relative;
}
.advisory-section.tone-diagnosis { border-left-color: var(--clay); }
.advisory-section.tone-action { border-left-color: var(--gold); }
.advisory-section.tone-prevention { border-left-color: var(--leaf); }
.advisory-section.tone-help { border-left-color: var(--sky); }
.advisory-section.tone-top { border-left-color: var(--gold); }
.advisory-section.tone-risk { border-left-color: var(--clay); }
.advisory-section.tone-fertilizer { border-left-color: var(--soil); }
.advisory-section.tone-calendar { border-left-color: var(--sky); }
.advisory-section.tone-week { border-left-color: var(--leaf); }
.sec-header {
  padding: 16px 18px; cursor: pointer; user-select: none;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.sec-header h3 {
  font-size: 13.5px; font-weight: 600; color: var(--ink);
  display: flex; align-items: center; gap: 7px; flex: 1;
}
.sec-arrow { font-size: 11px; color: var(--ink-soft); transition: transform 0.2s; flex-shrink: 0; }
.sec-arrow.open { transform: rotate(180deg); }
.sec-body { padding: 0 18px 16px; }
.advisory-section p, .advisory-section li { font-size: 14.5px; color: var(--ink); line-height: 1.6; }
.advisory-section ul, .advisory-section ol { padding-left: 18px; margin-top: 4px; }
.advisory-section li { margin-bottom: 5px; }
.advisory-section strong { color: var(--leaf-deep); }

.details-toggle {
  display: flex; align-items: center; gap: 6px; justify-content: center;
  padding: 12px; font-size: 13px; color: var(--ink-soft); cursor: pointer;
  font-weight: 500; user-select: none;
}
.details-toggle .arrow { transition: transform 0.2s; font-size: 11px; }
.details-toggle .arrow.open { transform: rotate(180deg); }
.data-sources { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.source-pill {
  font-size: 11px; padding: 4px 9px; border-radius: 20px;
  background: var(--ivory-warm); color: var(--ink-soft); border: 1px solid var(--line);
}

.error-card {
  background: var(--clay-soft); border-radius: var(--radius-lg); padding: 16px;
  border-left: 4px solid var(--clay); margin-bottom: 14px;
}
.error-card p { font-size: 14px; color: var(--clay); }

.toggle-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  cursor: pointer; font-size: 13.5px; color: var(--ink-soft); font-weight: 500;
}
.toggle-switch {
  width: 38px; height: 21px; border-radius: 11px; background: var(--line);
  position: relative; transition: background 0.2s; flex-shrink: 0;
}
.toggle-switch.on { background: var(--leaf); }
.toggle-switch::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 17px; height: 17px; border-radius: 50%; background: var(--white);
  transition: transform 0.2s; box-shadow: var(--shadow);
}
.toggle-switch.on::after { transform: translateX(17px); }
.soil-fields { margin-top: 12px; animation: reveal 0.25s ease; }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

.grounded-tag {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
  padding: 4px 10px; border-radius: 20px; background: var(--leaf-light);
  color: var(--leaf-deep); font-weight: 600; margin-top: 10px;
}
</style>

function parseAdvisory(text) {
  if (!text) return [];
  // Safety net for a truncated Gemini response: an incomplete trailing
  // header (opens with ** but the closing ** never arrived because
  // generation got cut off) would otherwise leak as garbled text glued
  // onto the previous section's body. Strip it before splitting.
  const cleaned = text.replace(/\*\*[A-Z][A-Z\s]*$/, "").trim();
  const parts = cleaned.split(/\*\*([A-Z][A-Z\s]+)\*\*/g);
  const sections = [];
  for (let i = 1; i < parts.length; i += 2) {
    const title = parts[i].trim();
    const body = (parts[i + 1] || "").trim();
    if (body) sections.push({ title, body });
  }
  return sections;
}

function renderMarkdown(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/^\* (.+)$/gm, "<li>$1</li>")
    .replace(/^\d+\.\s+(.+)$/gm, "<li>$1</li>")
    .replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
    .split(/\n{2,}/)
    .map(p => p.startsWith("<ul>") ? p : `<p>${p}</p>`)
    .join("");
}

// Collapsible advisory — first section open by default (the headline
// answer), the rest tucked away so the whole result fits closer to one
// screen instead of a long scroll. Tap any header to expand/collapse it.
function AdvisorySections({ sections, lang }) {
  const [openIdx, setOpenIdx] = useState(0);
  return (
    <div className="advisory">
      {sections.map((sec, i) => {
        const meta = SECTION_META[sec.title] || { icon: "📋", tone: "" };
        const isOpen = openIdx === i;
        return (
          <div className={`advisory-section tone-${meta.tone}`} key={i}>
            <div className="sec-header" onClick={() => setOpenIdx(isOpen ? -1 : i)}>
              <h3>{meta.icon} {sectionLabel(lang, sec.title)}</h3>
              <span className={`sec-arrow ${isOpen ? "open" : ""}`}>▾</span>
            </div>
            {isOpen && (
              <div className="sec-body" dangerouslySetInnerHTML={{ __html: renderMarkdown(sec.body) }} />
            )}
          </div>
        );
      })}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("crop");
  const [lang, setLang] = useState("en");

  return (
    <div>
      <div className="hero">
        <div className="hero-blobs">
          <div className="blob blob-1"></div>
          <div className="blob blob-2"></div>
          <div className="blob blob-3"></div>
        </div>
        <div className="hero-top">
          <div className="wordmark">
            <div className="mark">🌱</div>
            <div>
              <h1>AgriN</h1>
              <div className="tagline">{t(lang, "tagline")}</div>
            </div>
          </div>
          <select className="lang-select" value={lang} onChange={e => setLang(e.target.value)}>
            {Object.entries(LANGUAGES).map(([code, name]) => (
              <option key={code} value={code}>{name}</option>
            ))}
          </select>
        </div>
        <div className="tabs">
          <button className={`tab ${tab === "crop" ? "active" : ""}`} onClick={() => setTab("crop")}>
            🌾 {t(lang, "tabCrop")}
          </button>
          <button className={`tab ${tab === "disease" ? "active" : ""}`} onClick={() => setTab("disease")}>
            🔬 {t(lang, "tabDisease")}
          </button>
        </div>
      </div>
      <div className="content">
        {tab === "crop" ? <CropTab lang={lang} /> : <DiseaseTab lang={lang} />}
      </div>
    </div>
  );
}

function CropTab({ lang }) {
  const [lat, setLat] = useState("");
  const [lon, setLon] = useState("");
  const [showManual, setShowManual] = useState(false);
  const [manual, setManual] = useState({ N: "", P: "", K: "", ph: "" });
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);

  const useMyLocation = () => {
    if (!navigator.geolocation) { setError(t(lang, "noLoc")); return; }
    navigator.geolocation.getCurrentPosition(
      pos => { setLat(pos.coords.latitude.toFixed(4)); setLon(pos.coords.longitude.toFixed(4)); },
      () => setError(t(lang, "locErr"))
    );
  };

  const handleSubmit = async () => {
    if (!lat || !lon) { setError(t(lang, "enterLoc")); return; }
    setLoading(true); setError(null); setResult(null);
    try {
      const body = { lat: parseFloat(lat), lon: parseFloat(lon), language: lang };
      if (showManual) {
        if (manual.N) body.N = parseFloat(manual.N);
        if (manual.P) body.P = parseFloat(manual.P);
        if (manual.K) body.K = parseFloat(manual.K);
        if (manual.ph) body.ph = parseFloat(manual.ph);
      }
      const res = await fetch(`${API_BASE}/recommend`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(`Server error: ${res.status}`);
      setResult(await res.json());
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div>
      <div className="card">
        <div className="card-title">📍 {t(lang, "whereField")}</div>
        <div className="field-row">
          <div className="field">
            <input type="number" step="any" placeholder={t(lang, "lat")} value={lat} onChange={e => setLat(e.target.value)} />
          </div>
          <div className="field">
            <input type="number" step="any" placeholder={t(lang, "lon")} value={lon} onChange={e => setLon(e.target.value)} />
          </div>
        </div>
        <button className="btn btn-secondary" style={{ marginBottom: 14 }} onClick={useMyLocation}>
          📡 {t(lang, "useLocation")}
        </button>

        <div className="toggle-row" onClick={() => setShowManual(!showManual)}>
          <div className={`toggle-switch ${showManual ? "on" : ""}`}></div>
          {t(lang, "haveSoilCard")}
        </div>
        {showManual && (
          <div className="soil-fields">
            <div className="field-row">
              <div className="field"><input type="number" placeholder="N" value={manual.N} onChange={e => setManual({ ...manual, N: e.target.value })} /></div>
              <div className="field"><input type="number" placeholder="P" value={manual.P} onChange={e => setManual({ ...manual, P: e.target.value })} /></div>
            </div>
            <div className="field-row">
              <div className="field"><input type="number" placeholder="K" value={manual.K} onChange={e => setManual({ ...manual, K: e.target.value })} /></div>
              <div className="field"><input type="number" step="0.1" placeholder="pH" value={manual.ph} onChange={e => setManual({ ...manual, ph: e.target.value })} /></div>
            </div>
          </div>
        )}

        <button className="btn btn-primary" onClick={handleSubmit} disabled={loading}>
          {loading ? t(lang, "thinking") : `🌾 ${t(lang, "getRecommendation")}`}
        </button>
      </div>

      {loading && (
        <div className="loader">
          <div className="spinner"></div>
          <div className="loader-text">{t(lang, "readingSoil")}</div>
        </div>
      )}
      {error && <div className="error-card"><p>⚠️ {error}</p></div>}
      {result && <CropResult data={result} lang={lang} />}
    </div>
  );
}

function CropResult({ data, lang }) {
  const { summary, advisory, predictions, data_sources } = data;
  const sections = parseAdvisory(advisory);
  const [showDetails, setShowDetails] = useState(false);

  return (
    <div>
      <div className="summary-card ok">
        <div className="summary-title">{summary?.top_crop || "—"}</div>
        <div className="summary-subtitle">
          {summary?.location} · {summary?.season}{summary?.season_auto ? " (auto)" : ""}
        </div>
      </div>

      {predictions && predictions.length > 0 && (
        <div className="predictions">
          {predictions.slice(0, 3).map((p, i) => (
            <div className={`pred-card rank-${i + 1}`} key={i}>
              <div className={`pred-rank pred-rank-${i + 1}`}>{i + 1}</div>
              <div>
                <div className="pred-name">
                  {p.crop}
                  {p.viability_is_estimated && <span className="est-tag">est.</span>}
                </div>
                <div className="pred-detail">
                  {p.dominant_factor ? `↳ ${p.dominant_factor.feature}` : ""}
                </div>
              </div>
              <div className="pred-score">{(p.final_score * 100).toFixed(0)}%</div>
            </div>
          ))}
        </div>
      )}

      <AdvisorySections sections={sections} lang={lang} />

      {data_sources?.rag_grounded && (
        <div className="grounded-tag">✓ {t(lang, "grounded")}</div>
      )}

      <div className="details-toggle" onClick={() => setShowDetails(!showDetails)}>
        {showDetails ? t(lang, "hideData") : t(lang, "showData")}
        <span className={`arrow ${showDetails ? "open" : ""}`}>▾</span>
      </div>
      {showDetails && data_sources && (
        <div className="card">
          <div className="data-sources">
            <span className="source-pill">🌱 {data_sources.soil?.source || "—"}</span>
            <span className="source-pill">🌦️ {data_sources.climate?.years || "—"}yr</span>
            <span className="source-pill">🌧️ {data_sources.forecast?.rainfall_7d ?? "—"}mm</span>
            <span className="source-pill">🛰️ {data_sources.satellite?.interpretation || "—"}</span>
          </div>
          {data_sources.soil?.note && (
            <p style={{ fontSize: 12, color: "var(--ink-soft)", marginTop: 10 }}>{data_sources.soil.note}</p>
          )}
        </div>
      )}
    </div>
  );
}

function DiseaseTab({ lang }) {
  const [image, setImage] = useState(null);
  const [imagePreview, setImagePreview] = useState(null);
  const [lat, setLat] = useState("");
  const [lon, setLon] = useState("");
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const fileRef = useRef();

  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setImage(file);
    setImagePreview(URL.createObjectURL(file));
  };

  const handleSubmit = async () => {
    if (!image) { setError(t(lang, "uploadFirst")); return; }
    setLoading(true); setError(null); setResult(null);
    try {
      const form = new FormData();
      form.append("file", image);
      form.append("language", lang);
      if (lat) form.append("lat", lat);
      if (lon) form.append("lon", lon);
      const res = await fetch(`${API_BASE}/disease`, { method: "POST", body: form });
      if (!res.ok) throw new Error(`Server error: ${res.status}`);
      setResult(await res.json());
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div>
      <div className="card">
        <div className="card-title">📸 {t(lang, "showLeaf")}</div>
        <div className={`upload-area ${imagePreview ? "has-image" : ""}`} onClick={() => fileRef.current?.click()}>
          {imagePreview
            ? <img src={imagePreview} alt="Uploaded leaf" />
            : <>
                <div className="upload-icon">📷</div>
                <div className="upload-text">{t(lang, "tapPhoto")}</div>
              </>
          }
          <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={handleFile} />
        </div>

        <div style={{ marginTop: 14 }}>
          <div className="card-title" style={{ fontSize: 12.5, color: "var(--ink-soft)" }}>📍 {t(lang, "optionalLoc")}</div>
          <div className="field-row">
            <div className="field"><input type="number" step="any" placeholder={t(lang, "lat")} value={lat} onChange={e => setLat(e.target.value)} /></div>
            <div className="field"><input type="number" step="any" placeholder={t(lang, "lon")} value={lon} onChange={e => setLon(e.target.value)} /></div>
          </div>
        </div>

        <button className="btn btn-primary" onClick={handleSubmit} disabled={loading || !image}>
          {loading ? t(lang, "diagnosing") : `🔬 ${t(lang, "scanDisease")}`}
        </button>
      </div>

      {loading && (
        <div className="loader">
          <div className="spinner"></div>
          <div className="loader-text">{t(lang, "lookingClosely")}</div>
        </div>
      )}
      {error && <div className="error-card"><p>⚠️ {error}</p></div>}
      {result && <DiseaseResult data={result} lang={lang} />}
    </div>
  );
}

function DiseaseResult({ data, lang }) {
  const { summary, advisory, details } = data;
  const sections = parseAdvisory(advisory);
  const isHealthy = summary?.status === "healthy";
  const isUncertain = summary?.identification_uncertain;
  const [showDetails, setShowDetails] = useState(false);

  return (
    <div>
      {isUncertain && (
        <div className="uncertain-banner">
          <div className="icon">🔎</div>
          <div className="text">
            <strong>{t(lang, "uncertainTitle")}</strong> {t(lang, "uncertainBody")}
          </div>
        </div>
      )}

      <div className={`summary-card ${isHealthy ? "ok" : "warn"}`}>
        <div className="summary-title">{isHealthy ? "✅ " : ""}{summary?.disease || "Unknown"}</div>
        <div className="summary-subtitle">{summary?.crop || "—"} · {summary?.confidence || "—"}</div>
      </div>

      {details?.all_predictions && details.all_predictions.length > 1 && (
        <div className="card">
          <div className="card-title" style={{ fontSize: 12.5 }}>{t(lang, "otherPoss")}</div>
          {details.all_predictions.slice(1, 4).map((p, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", fontSize: 13, color: "var(--ink-soft)" }}>
              <span>{p.crop} — {p.disease || "Healthy"}</span>
              <span style={{ fontWeight: 600 }}>{(p.confidence * 100).toFixed(1)}%</span>
            </div>
          ))}
        </div>
      )}

      <AdvisorySections sections={sections} lang={lang} />

      {details?.rag_grounded && (
        <div className="grounded-tag">✓ {t(lang, "grounded")}</div>
      )}

      {(details?.satellite?.ndvi || details?.ood_check) && (
        <>
          <div className="details-toggle" onClick={() => setShowDetails(!showDetails)}>
            {showDetails ? t(lang, "hideTech") : t(lang, "showTech")}
            <span className={`arrow ${showDetails ? "open" : ""}`}>▾</span>
          </div>
          {showDetails && (
            <div className="card">
              {details?.satellite?.ndvi && (
                <p style={{ fontSize: 13, color: "var(--ink-soft)", marginBottom: 8 }}>
                  🛰️ {t(lang, "ndviLabel")}: {details.satellite.ndvi} — {details.satellite.interpretation}
                </p>
              )}
              {details?.ood_check && (
                <p style={{ fontSize: 13, color: "var(--ink-soft)" }}>
                  {t(lang, "matchConf")}: {details.ood_check.distance_to_nearest_class} / {details.ood_check.threshold}
                </p>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
